="23" y="29" width="13" height="1.2" class="pad" rx=".16"/><rect x="23.13" y="29.13" width="12.74" height="0.94" class="padtop" rx=".12"/><rect x="33.5" y="21" width="12" height="6" class="pad" /><rect x="33.5" y="21" width="2.5" height="6" class="bank" /><rect x="43" y="21" width="2.5" height="6" class="bank" /><rect x="36" y="21" width="7" height="6" class="padtop" /><line x1="33.5" y1="21.2" x2="45.5" y2="21.2" class="grind-edge" /><line x1="33.8" y1="24" x2="35.7" y2="24" class="slope" marker-end="url(#slope-arrow)"/><line x1="45.2" y1="24" x2="43.3" y2="24" class="slope" marker-end="url(#slope-arrow)"/><line x1="36.2" y1="24" x2="42.8" y2="24" class="flight-line" /><text x="39.5" y="22.9" class="map-label jump-label">TABLETOP</text><circle cx="31" cy="14.5" r=".75" class="spot-disc"/><text x="31" y="14.75" class="map-label spot-label">R</text><circle cx="29.5" cy="32" r=".75" class="spot-disc"/><text x="29.5" y="32.25" class="map-label spot-label">L</text><circle cx="40" cy="29.5" r=".75" class="spot-disc"/><text x="40" y="29.75" class="map-label spot-label">P</text><circle cx="34.5" cy="8.8" r=".75" class="spot-disc"/><text x="34.5" y="9.05" class="map-label spot-label">M</text><text x="23" y="20.7" class="map-label flat-label">FLAT</text><text x="31" y="37.5" class="map-label flat-label">FLAT</text><text x="32" y="-3.5" class="map-label sea-label">PLAGE / MER</text><circle cx="19" cy="39.5" r="1" class="start-disc"/><text x="19" y="39.82" class="start-text">A</text><circle cx="8.28" cy="7.28" r="1" class="start-disc"/><text x="8.28" y="7.6000000000000005" class="start-text">B</text><circle cx="55.72" cy="7.28" r="1" class="start-disc"/><text x="55.72" y="7.6000000000000005" class="start-text">C</text><circle cx="55.72" cy="36.72" r="1" class="start-disc"/><text x="55.72" y="37.04" class="start-text">D</text><path d="M32 47V44.5m-.4.6.4-.6.4.6" class="slope"/></g><text x="1295" y="175" fill="#204e5b" font-family="Arial,sans-serif" font-size="22" font-weight="700">A — LES DUNES</text><text x="1295" y="212" fill="#204e5b" font-family="Arial,sans-serif" font-size="16" font-weight="400">Coin bas et départ par bank droit.</text><text x="1295" y="242" fill="#204e5b" font-family="Arial,sans-serif" font-size="16" font-weight="400">Plateforme aux contours adoucis.</text><text x="1295" y="315" fill="#204e5b" font-family="Arial,sans-serif" font-size="22" font-weight="700">B — LES PALMIERS</text><text x="1295" y="352" fill="#204e5b" font-family="Arial,sans-serif" font-size="16" font-weight="400">Terrasse courbe reliée aux quatre marches.</text><text x="1295" y="382" fill="#204e5b" font-family="Arial,sans-serif" font-size="16" font-weight="400">Main courante, hubba et bank adjacent.</text><text x="1295" y="455" fill="#204e5b" font-family="Arial,sans-serif" font-size="22" font-weight="700">C — L’ANSE DU LARGE</text><text x="1295" y="492" fill="#204e5b" font-family="Arial,sans-serif" font-size="16" font-weight="400">Petit bowl ouvert sur le centre du park.</text><text x="1295" y="522" fill="#204e5b" font-family="Arial,sans-serif" font-size="16" font-weight="400">Courbe plus enveloppante et légèrement ovale.</text><text x="1295" y="595" fill="#204e5b" font-family="Arial,sans-serif" font-size="22" font-weight="700">D — LE RETOUR DU SOLEIL</text><text x="1295" y="632" fill="#204e5b" font-family="Arial,sans-serif" font-size="16" font-weight="400">Quarter étiré en une longue vague.</text><text x="1295" y="662" fill="#204e5b" font-family="Arial,sans-serif" font-size="16" font-weight="400">La sortie revient vers le ledge et le flat.</text><text x="1295" y="750" fill="#204e5b" font-family="Arial,sans-serif" font-size="22" font-weight="700">P — LA GRANDE VAGUE</text><text x="1295" y="787" fill="#204e5b" font-family="Arial,sans-serif" font-size="16" font-weight="400">Tabletop recentré, axe dégagé des deux côtés.</text><text x="1295" y="817" fill="#204e5b" font-family="Arial,sans-serif" font-size="16" font-weight="400">Élan, saut et sortie dans le même alignement.</text><text x="1295" y="847" fill="#204e5b" font-family="Arial,sans-serif" font-size="16" font-weight="400">R — Rail bas · L — Ledge long · M — Marches</text><text x="1295" y="935" fill="#204e5b" font-family="Arial,sans-serif" font-size="20" font-weight="700">12 CARTES / MÊMES ÉQUIPEMENTS</text><text x="1295" y="975" fill="#204e5b" font-family="Arial,sans-serif" font-size="17" font-weight="400">4 cartes niveaux 1–2</text><text x="1295" y="1007" fill="#204e5b" font-family="Arial,sans-serif" font-size="17" font-weight="400">6 cartes niveaux 3–5</text><text x="1295" y="1039" fill="#204e5b" font-family="Arial,sans-serif" font-size="17" font-weight="400">2 cartes niveau 6</text><text x="1295" y="1092" fill="#204e5b" font-family="Arial,sans-serif" font-size="17" font-weight="400">08 — Retour en vague par D</text><text x="1295" y="1124" fill="#204e5b" font-family="Arial,sans-serif" font-size="17" font-weight="400">11 / 12 — Approches du grand saut</text><text x="60" y="1190" fill="#204e5b" font-family="Arial,sans-serif" font-size="16" font-weight="400">Les coins ont des formes distinctes. Les mêmes départs et équipements restent partagés entre plusieurs cartes.</text><text x="60" y="1222" fill="#204e5b" font-family="Arial,sans-serif" font-size="16" font-weight="400">La bande discrète au sol indique l’axe d’approche et de sortie du grand saut ; ce n’est pas un obstacle.</text><text x="60" y="1278" fill="#204e5b" font-family="Arial,sans-serif" font-size="15" font-weight="400">Étude pour le jeu · géométrie et lignes indicatives · sans échelle de construction ni calcul de vitesse.</text></svg>